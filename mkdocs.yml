  - 第 4 章 转化——个性化定价与对话式成交: 04-第4章-转化-AI个性化定价与对话式成交.md
  - 第 5 章 服务——AI 客服与人工兜底: 05-第5章-服务-AI客服与人工兜底.md
  - 第 6 章 留存与扩展——客户成功 AI 化: 06-第6章-留存与扩展-客户成功AI化.md
  - 第 7 章 底座——AI CRM 与客户数据: 07-第7章-底座-AI-CRM与客户数据.md
