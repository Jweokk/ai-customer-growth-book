site_name: AI 客户经营
site_description: AI-Powered Customer Operations — 当每个客户都值得被 AI 认真对待时，人做什么？
site_url: https://ai-customer-growth.fly2ai.top
docs_dir: book
site_dir: site
repo_url: https://github.com/Jweokk/ai-customer-growth-book
repo_name: GitHub
hooks:
  - tools/mkdocs_hooks.py

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - footnotes
  - attr_list

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Jweokk
      name: GitHub

copyright: 著作权归作者 Jweokk 所有 · 免费阅读与非商业性分享 · 联系 weokk2025@gmail.com

